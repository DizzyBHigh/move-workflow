name: Fix Editor Recursion

on:
  push:
    branches:
      - phase6-workflow-engine

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-workflow-engine
          fetch-depth: 0

      - name: Remove recursive scene-change connection
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/move-workflow-editor.cpp")
          text = path.read_text(encoding="utf-8")
          old = '        connect(this, &QGraphicsScene::changed, this, [this] { updateConnections(); });\n'
          new = '        connect(this, &QGraphicsScene::changed, this, [this] { updateConnectionGeometry(); });\n'
          if old not in text:
              print("Recursive connection already fixed or source has changed; nothing to do.")
              raise SystemExit(0)
          text = text.replace(old, new, 1)
          old_method = '''    void updateConnections()\n    {\n        for (const Connection &connection : connections_)\n            updateConnection(connection.line, connection.from, connection.to);\n        updateSceneBounds();\n    }\n'''
          new_method = '''    void updateConnectionGeometry()\n    {\n        for (const Connection &connection : connections_)\n            updateConnection(connection.line, connection.from, connection.to);\n    }\n\n    void updateConnections()\n    {\n        updateConnectionGeometry();\n        updateSceneBounds();\n    }\n'''
          if old_method not in text:
              raise SystemExit("Expected updateConnections implementation was not found")
          text = text.replace(old_method, new_method, 1)
          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit fix
        run: |
          if git diff --quiet -- src/move-workflow-editor.cpp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/move-workflow-editor.cpp
          git commit -m "Fix editor scene-change recursion"
          git push origin HEAD:phase6-workflow-engine
